# Production: KHÔNG build từ source, chỉ pull image đã build sẵn từ registry.
# Dùng trên EC2:  docker compose -f docker-compose.prod.yml up -d
services:
  web:
    # Image trên GHCR. Override qua biến IMAGE khi cần đổi tag/user.
    image: ${IMAGE:-ghcr.io/nhatnv2-vnext/my-project-vault:v1}
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - WIKI_ROOT_PATH=/wiki
      - LANCEDB_PATH=/data/lancedb
    volumes:
      - ./02_Wiki:/wiki:ro
      - lancedb_data:/data/lancedb
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mcp:
    # Image MCP server (build target mcp-runner). Override qua biến MCP_IMAGE.
    image: ${MCP_IMAGE:-ghcr.io/nhatnv2-vnext/my-project-vault-mcp:v1}
    ports:
      # CHỈ bind loopback của host: MCP (chưa auth) KHÔNG lộ ra internet trên
      # droplet/EC2. Đặt sau reverse proxy có auth, hoặc chỉ mở MCP_BIND=0.0.0.0
      # khi đã khóa port 3001 bằng security group/firewall.
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-3001}:3001"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      # Lắng nghe mọi interface bên trong container; an toàn nhờ host bind loopback.
      - MCP_HOST=0.0.0.0
      - WIKI_ROOT_PATH=/wiki
      - LANCEDB_PATH=/data/lancedb
    volumes:
      - ./02_Wiki:/wiki:ro
      - lancedb_data:/data/lancedb:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  lancedb_data:
