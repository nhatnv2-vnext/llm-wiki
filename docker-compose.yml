services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    # Env khai báo ở MỘT nơi duy nhất: .env.local (root). Compose nạp trực tiếp.
    env_file:
      - .env.local
    environment:
      # Các biến đặc thù môi trường container, ghi đè giá trị trong .env.local nếu có.
      - NODE_ENV=production
      - WIKI_ROOT_PATH=/wiki
      - LANCEDB_PATH=/data/lancedb
      - CHAT_DB_PATH=/data/chat/history.db
    volumes:
      # 02_Wiki mount read-only — app chỉ đọc, không ghi.
      - ./02_Wiki:/wiki:ro
      # LanceDB data persist giữa các lần restart.
      - lancedb_data:/data/lancedb
      # Lịch sử chat (SQLite) persist giữa các lần restart.
      - chat_data:/data/chat
    restart: unless-stopped
    healthcheck:
      # Dùng node thay vì wget — image node:22-slim không có wget.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-runner
    ports:
      - "${MCP_PORT:-3001}:3001"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - WIKI_ROOT_PATH=/wiki
      - LANCEDB_PATH=/data/lancedb
    volumes:
      # Vault read-only — MCP server không bao giờ ghi.
      - ./02_Wiki:/wiki:ro
      # Share index với service web (web đã ingest lúc khởi động).
      - lancedb_data:/data/lancedb:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  lancedb_data:
  chat_data:
